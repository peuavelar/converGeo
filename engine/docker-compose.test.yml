services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: convergeo
      POSTGRES_PASSWORD: test
      POSTGRES_DB: convergeo_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convergeo -d convergeo_test"]
      interval: 5s
      timeout: 5s
      retries: 10
