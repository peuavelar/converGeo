name: engine

on:
  push:
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not integration"

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: convergeo
          POSTGRES_PASSWORD: test
          POSTGRES_DB: convergeo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U convergeo -d convergeo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://convergeo:test@localhost:5432/convergeo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q -m integration
