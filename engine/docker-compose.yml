# Postgres + PostGIS no modelo técnico do Thiago (schema convergeo).
# Uso local:
#   docker compose -f engine/docker-compose.yml up -d
#   export DATABASE_URL=postgresql://postgres:convergeo@127.0.0.1:5432/convergeo
#   python -m convergeo_engine.cli migrate
#   python -m convergeo_engine.cli bootstrap
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: convergeo
      POSTGRES_DB: convergeo
    ports:
      - "5432:5432"
    volumes:
      - convergeo_pg:/var/lib/postgresql/data

volumes:
  convergeo_pg:
